[package]
name = "jockey-studio"
version = "0.1.0"
description = "Jockey Studio — multi-deck audio mixer with native device routing"
authors = ["CJay Capillo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jockey_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
semver = "1"
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "alac", "aiff", "caf", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
strip = true
